# ====================================================================
# CapCheck AI — Netlify Production Deployment Configuration
# Decoupled Frontend (React 18 / Vite / Tailwind CSS) + FastAPI Backend
# ====================================================================

[build]
  base = "frontend"
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"

# --------------------------------------------------------------------
# SPA Routing: Redirect all web paths to index.html for React Router
# --------------------------------------------------------------------
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# --------------------------------------------------------------------
# Production Security Headers & Asset Caching
# --------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
